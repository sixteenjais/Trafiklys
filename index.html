<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Trafiklys" />
  <title>Klasse Trafiklys</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --primary: #007aff;
      --green: #34c759;
      --yellow: #ffcc00;
      --red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(242, 242, 247, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
    }

    select {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      padding: 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    button {
      border: none;
      border-radius: 10px;
      height: 40px;
      padding: 0 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: #ffe5e5;
      color: var(--red);
      padding: 0 12px;
    }

    .stats {
      max-width: 600px;
      margin: 10px auto 0;
      display: flex;
      justify-content: space-around;
      background: var(--card);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    main {
      max-width: 600px;
      margin: 14px auto;
      padding: 0 16px;
    }

    .add-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .add-box input {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      padding: 0 12px;
      font-size: 16px;
    }

    .student-list {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .student-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .student-row:last-child {
      border-bottom: none;
    }

    .student-name {
      font-size: 17px;
      font-weight: 500;
      flex: 1;
      padding-right: 10px;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .traffic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.08);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .status-green { background: var(--green); }
    .status-yellow { background: var(--yellow); }
    .status-red { background: var(--red); }

    .delete-student {
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      width: 32px;
      height: 32px;
      padding: 0;
    }

    .empty-state {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 20px;
      margin-top: 20px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .empty-state p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(242, 242, 247, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .footer-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .btn-reset {
      flex: 1;
      background: var(--green);
      color: #fff;
      height: 46px;
      font-size: 16px;
    }

    /* Modal til ny klasse / indsæt liste */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .modal p {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .modal input,
    .modal textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .modal textarea {
      min-height: 140px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <select id="classSelect" aria-label="Vælg klasse"></select>
      <button type="button" class="btn-primary" id="openNewClassBtn">+ Ny klasse</button>
      <button type="button" class="btn-danger" id="deleteClassBtn" title="Slet klasse">🗑️</button>
    </div>

    <div class="stats" id="statsBar" style="display: none;">
      <div class="stat-item"><span class="dot status-green"></span> <span id="countGreen">0</span></div>
      <div class="stat-item"><span class="dot status-yellow"></span> <span id="countYellow">0</span></div>
      <div class="stat-item"><span class="dot status-red"></span> <span id="countRed">0</span></div>
    </div>
  </header>

  <main id="mainContent"></main>

  <footer id="footerBar" style="display: none;">
    <div class="footer-inner">
      <button type="button" class="btn-reset" id="resetAllBtn">Nulstil time (alle til grøn)</button>
    </div>
  </footer>

  <!-- Modal: Opret ny klasse -->
  <div class="modal-backdrop" id="newClassModal">
    <div class="modal">
      <h3>Opret ny klasse</h3>
      <p>Skriv klassens navn (f.eks. 4.A eller Matematik 6.B):</p>
      <input type="text" id="newClassNameInput" placeholder="F.eks. 4.A" />
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelNewClassBtn">Annuller</button>
        <button type="button" class="btn-primary" id="confirmNewClassBtn">Opret</button>
      </div>
    </div>
  </div>

  <!-- Modal: Indsæt elevliste -->
  <div class="modal-backdrop" id="bulkModal">
    <div class="modal">
      <h3>Indsæt elevliste</h3>
      <p>Indsæt ét navn pr. linje (maks. 25 elever i alt pr. klasse):</p>
      <textarea id="bulkNamesInput" placeholder="Anders&#10;Sofie&#10;Mikkel"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelBulkBtn">Annuller</button>
        <button type="button" class="btn-primary" id="confirmBulkBtn">Tilføj elever</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "klasse_trafiklys_data_v1";
      let memoryFallback = null;

      let state = {
        classes: {},
        activeClass: ""
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed.classes === "object") {
              state = parsed;
            }
          }
        } catch (e) {
          if (memoryFallback) state = memoryFallback;
        }
      }

      function saveState() {
        memoryFallback = JSON.parse(JSON.stringify(state));
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Ignorerer fejl hvis browseren blokerer localStorage
        }
      }

      const classSelect = document.getElementById("classSelect");
      const mainContent = document.getElementById("mainContent");
      const statsBar = document.getElementById("statsBar");
      const footerBar = document.getElementById("footerBar");
      const deleteClassBtn = document.getElementById("deleteClassBtn");

      const newClassModal = document.getElementById("newClassModal");
      const newClassNameInput = document.getElementById("newClassNameInput");
      const bulkModal = document.getElementById("bulkModal");
      const bulkNamesInput = document.getElementById("bulkNamesInput");

      function render() {
        const classNames = Object.keys(state.classes);

        if (classNames.length > 0 && !state.classes[state.activeClass]) {
          state.activeClass = classNames[0];
        }

        classSelect.innerHTML = "";
        if (classNames.length === 0) {
          const opt = document.createElement("option");
          opt.textContent = "Ingen klasser endnu";
          opt.value = "";
          classSelect.appendChild(opt);
          classSelect.disabled = true;
          deleteClassBtn.style.display = "none";
          statsBar.style.display = "none";
          footerBar.style.display = "none";

          mainContent.innerHTML = `
            <div class="empty-state">
              <h2>Velkommen til Trafiklys</h2>
              <p>Opret din første klasse for at komme i gang med at tilføje elever.</p>
              <button type="button" class="btn-primary" id="emptyCreateBtn">+ Opret første klasse</button>
            </div>
          `;
          document.getElementById("emptyCreateBtn").addEventListener("click", openNewClassModal);
          return;
        }

        classSelect.disabled = false;
        deleteClassBtn.style.display = "inline-flex";
        statsBar.style.display = "flex";
        footerBar.style.display = "block";

        classNames.forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          if (name === state.activeClass) opt.selected = true;
          classSelect.appendChild(opt);
        });

        const students = state.classes[state.activeClass] || [];

        let green = 0, yellow = 0, red = 0;
        students.forEach((s) => {
          if (s.status === "yellow") yellow++;
          else if (s.status === "red") red++;
          else green++;
        });
        document.getElementById("countGreen").textContent = green;
        document.getElementById("countYellow").textContent = yellow;
        document.getElementById("countRed").textContent = red;

        let html = `
          <div class="add-box">
            <input type="text" id="singleStudentInput" placeholder="Tilføj elevnavn..." maxlength="40" />
            <button type="button" class="btn-primary" id="addSingleBtn">Tilføj</button>
            <button type="button" class="btn-secondary" id="openBulkBtn">Indsæt liste</button>
          </div>
        `;

        if (students.length === 0) {
          html += `
            <div class="empty-state">
              <h2>${escapeHtml(state.activeClass)} er tom</h2>
              <p>Skriv et elevnavn i feltet ovenfor, eller tryk på <strong>Indsæt liste</strong> for at indsætte hele klassen på én gang.</p>
            </div>
          `;
        } else {
          html += `<div class="student-list">`;
          students.forEach((student, index) => {
            const statusClass = "status-" + (student.status || "green");
            html += `
              <div class="student-row">
                <span class="student-name">${escapeHtml(student.name)}</span>
                <div class="row-actions">
                  <button type="button" class="traffic-btn ${statusClass}" data-index="${index}" aria-label="Skift farve for ${escapeHtml(student.name)}"></button>
                  <button type="button" class="delete-student" data-del="${index}" title="Fjern elev">✕</button>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }

        mainContent.innerHTML = html;

        const singleInput = document.getElementById("singleStudentInput");
        const addSingleBtn = document.getElementById("addSingleBtn");
        const openBulkBtn = document.getElementById("openBulkBtn");

        addSingleBtn.addEventListener("click", () => addSingleStudent(singleInput.value));
        singleInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addSingleStudent(singleInput.value);
          }
        });

        openBulkBtn.addEventListener("click", () => {
          bulkNamesInput.value = "";
          bulkModal.classList.add("open");
          setTimeout(() => bulkNamesInput.focus(), 50);
        });

        mainContent.querySelectorAll(".traffic-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.getAttribute("data-index"));
            cycleStatus(idx);
          });
        });

        mainContent.querySelectorAll(".delete-student").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.getAttribute("data-del"));
            removeStudent(idx);
          });
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function openNewClassModal() {
        newClassNameInput.value = "";
        newClassModal.classList.add("open");
        setTimeout(() => newClassNameInput.focus(), 50);
      }

      function createClass() {
        const name = newClassNameInput.value.trim();
        if (!name) return;
        if (!state.classes[name]) {
          state.classes[name] = [];
        }
        state.activeClass = name;
        saveState();
        newClassModal.classList.remove("open");
        render();
      }

      function addSingleStudent(rawName) {
        const name = rawName.trim();
        if (!name || !state.activeClass) return;
        const list = state.classes[state.activeClass];
        if (list.length >= 25) {
          alert("Der kan maks. være 25 elever i en klasse.");
          return;
        }
        list.push({ name: name, status: "green" });
        saveState();
        render();
        const nextInput = document.getElementById("singleStudentInput");
        if (nextInput) nextInput.focus();
      }

      function addBulkStudents() {
        if (!state.activeClass) return;
        const lines = bulkNamesInput.value
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter((l) => l.length > 0);

        const list = state.classes[state.activeClass];
        for (const name of lines) {
          if (list.length >= 25) break;
          list.push({ name: name, status: "green" });
        }
        saveState();
        bulkModal.classList.remove("open");
        render();
      }

      function cycleStatus(index) {
        const list = state.classes[state.activeClass];
        if (!list || !list[index]) return;
        const order = ["green", "yellow", "red"];
        const current = list[index].status || "green";
        const next = order[(order.indexOf(current) + 1) % order.length];
        list[index].status = next;
        saveState();
        render();
      }

      function removeStudent(index) {
        const list = state.classes[state.activeClass];
        if (!list) return;
        list.splice(index, 1);
        saveState();
        render();
      }

      document.getElementById("openNewClassBtn").addEventListener("click", openNewClassModal);
      document.getElementById("cancelNewClassBtn").addEventListener("click", () => {
        newClassModal.classList.remove("open");
      });
      document.getElementById("confirmNewClassBtn").addEventListener("click", createClass);
      newClassNameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          createClass();
        }
      });

      document.getElementById("cancelBulkBtn").addEventListener("click", () => {
        bulkModal.classList.remove("open");
      });
      document.getElementById("confirmBulkBtn").addEventListener("click", addBulkStudents);

      classSelect.addEventListener("change", () => {
        state.activeClass = classSelect.value;
        saveState();
        render();
      });

      deleteClassBtn.addEventListener("click", () => {
        if (!state.activeClass) return;
        if (confirm(`Vil du slette klassen "${state.activeClass}" og alle dens elever?`)) {
          delete state.classes[state.activeClass];
          state.activeClass = Object.keys(state.classes)[0] || "";
          saveState();
          render();
        }
      });

      document.getElementById("resetAllBtn").addEventListener("click", () => {
        const list = state.classes[state.activeClass];
        if (!list) return;
        list.forEach((s) => (s.status = "green"));
        saveState();
        render();
      });

      loadState();
      render();
    })();
  </script>
</body>
</html>
